services:
  eaglercraft:
    build: .
    container_name: eaglercraft
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565"
    environment:
      EULA: "true"
      MEMORY: 2G
      MOTD: An Eaglercraft Server
      MAX_PLAYERS: 20
      VIEW_DISTANCE: 6
    volumes:
      - ./server-data:/data
